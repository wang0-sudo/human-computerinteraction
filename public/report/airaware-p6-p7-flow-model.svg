<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="flow-model-title flow-model-desc" style="font-family:'Microsoft YaHei',sans-serif"><title id="flow-model-title">学生必要出行的现状关系流程模型</title><desc id="flow-model-desc">教师或实习负责人向学生传递日程，学生与家人协商陪同，与配送同伴交换经验，与商户确认休息条件，医护提供注意事项。B1至B4表示固定日程、协作成本、设施不确定和信息分散。</desc><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526d62"/></marker></defs><rect width="1100" height="620" fill="#fff"/>
  <g fill="none" stroke="#526d62" stroke-width="2.5" marker-end="url(#flow-arrow)"><path d="M280 135L465 255"/><path d="M820 135L635 255" marker-start="url(#flow-arrow)"/><path d="M300 305H421" marker-start="url(#flow-arrow)"/><path d="M280 460L465 355" marker-start="url(#flow-arrow)"/><path d="M820 460L635 355"/></g>
  <g><rect x="50" y="35" width="250" height="100" rx="6" fill="#f2f6f4" stroke="#bdcec5"/><circle cx="78" cy="65" r="9" fill="#347c88"/><path d="M62 96q0-26 32 0" fill="none" stroke="#347c88" stroke-width="6"/><text x="100" y="71" font-size="19" font-weight="700" fill="#253b36">教师 / 实习负责人</text><text x="68" y="115" font-size="13" fill="#52675e">课程、考试、会议等到达约束</text></g><g><rect x="800" y="35" width="250" height="100" rx="6" fill="#f2f6f4" stroke="#bdcec5"/><circle cx="828" cy="65" r="9" fill="#347c88"/><path d="M812 96q0-26 32 0" fill="none" stroke="#347c88" stroke-width="6"/><text x="850" y="71" font-size="19" font-weight="700" fill="#253b36">家人 / 陪同者</text><text x="818" y="115" font-size="13" fill="#52675e">解释信息、陪同、接送</text></g><g><rect x="50" y="255" width="250" height="100" rx="6" fill="#f2f6f4" stroke="#bdcec5"/><circle cx="78" cy="285" r="9" fill="#347c88"/><path d="M62 316q0-26 32 0" fill="none" stroke="#347c88" stroke-width="6"/><text x="100" y="291" font-size="19" font-weight="700" fill="#253b36">配送同伴</text><text x="68" y="335" font-size="13" fill="#52675e">路况、休息点和工作经验</text></g><g><rect x="425" y="255" width="250" height="100" rx="6" fill="#23674f" stroke="#23674f"/><circle cx="453" cy="285" r="9" fill="#d8eee1"/><path d="M437 316q0-26 32 0" fill="none" stroke="#d8eee1" stroke-width="6"/><text x="475" y="291" font-size="19" font-weight="700" fill="#fff">学生出行者</text><text x="443" y="335" font-size="13" fill="#e2f2e9">U01–U04；自主权衡与决定</text></g><g><rect x="50" y="460" width="250" height="100" rx="6" fill="#f2f6f4" stroke="#bdcec5"/><circle cx="78" cy="490" r="9" fill="#347c88"/><path d="M62 521q0-26 32 0" fill="none" stroke="#347c88" stroke-width="6"/><text x="100" y="496" font-size="19" font-weight="700" fill="#253b36">商户 / 场所人员</text><text x="68" y="540" font-size="13" fill="#52675e">允许停留、补水或短暂休息</text></g><g><rect x="800" y="460" width="250" height="100" rx="6" fill="#f2f6f4" stroke="#bdcec5"/><circle cx="828" cy="490" r="9" fill="#347c88"/><path d="M812 521q0-26 32 0" fill="none" stroke="#347c88" stroke-width="6"/><text x="850" y="496" font-size="19" font-weight="700" fill="#253b36">医护人员</text><text x="818" y="540" font-size="13" fill="#52675e">注意事项与必要就医安排</text></g>
  <g><rect x="301" y="172" width="128" height="29" fill="#fff"/><text x="365" y="192" text-anchor="middle" font-size="16" fill="#253b36">F1 日程安排</text></g><g><rect x="676" y="172" width="128" height="29" fill="#fff"/><text x="740" y="192" text-anchor="middle" font-size="16" fill="#253b36">F2 陪同协商</text></g><g><rect x="299" y="270" width="128" height="29" fill="#fff"/><text x="363" y="290" text-anchor="middle" font-size="16" fill="#253b36">F3 经验交流</text></g><g><rect x="301" y="394" width="128" height="29" fill="#fff"/><text x="365" y="414" text-anchor="middle" font-size="16" fill="#253b36">F4 休息支持</text></g><g><rect x="676" y="394" width="128" height="29" fill="#fff"/><text x="740" y="414" text-anchor="middle" font-size="16" fill="#253b36">F5 医护建议</text></g>
  <g fill="#a74648" font-size="14" font-weight="700"><text x="78" y="161">B1 固定时间</text><text x="825" y="161">B2 协调成本</text><text x="78" y="588">B3 地点可能不可用</text></g><text x="550" y="590" text-anchor="middle" font-size="14" fill="#52675e">B4 辅助工具分散：天气 / 空气质量 / 地图 / 公交</text></svg>